<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <script>
    // Capture page load start time as early as possible
    window.startTime = Date.now();
  </script>
  <meta name="google-adsense-account" content="ca-pub-3771202695871772">
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-3771202695871772"
     crossorigin="anonymous"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>reCalc</title>
  <link rel="stylesheet" href="styles.css" />
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lottie-web@5.9.4/build/player/lottie.min.js" defer></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-functions-compat.js"></script>
 

  <meta property="og:title" content="reCalc - Your Receipt Calculator">
  <meta property="og:description" content="Easily split receipts between friends with automatic calculations and simple steps.">
  <meta property="og:url" content="https://re-calc.com/">
  <meta property="og:type" content="website">

  <meta property="og:image" content="https://re-calc.com/preview.png">

  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="reCalc - Your Receipt Calculator">
  <meta name="twitter:description" content="Easily split receipts between friends with automatic calculations and simple steps.">
  <meta name="twitter:image" content="https://re-calc.com/preview.png">
</head>


<body>
  <div id="page-loader" class="active">
    <div class="loader-lottie"></div>
  </div>

  <div id="page-wrapper">
    <div class="top-header">
	    <div id="language-toggle">
			<span class="lang-link" onclick="toggleLanguage()">🌐 English</span>
		</div>
		
		<div class="auth-area" style="display:flex; gap:12px; align-items:center;">
			<div id="user-box" style="display:flex;flex-direction:column;align-items:center;">
				<div id="user-info" style="font-size:13px;"></div>
			<div id="auth-controls" style="display:none; margin-top:6px;">
					<button id="auth-manage-button" onclick="location.href='manage.html'">Manage</button>
					<button id="auth-logout-button" onclick="authLogout()">Logout</button>
				</div>
			</div>

			<div style="display:flex; align-items:center; gap:8px;">
				<button id="auth-button">Sign in</button>
			</div>
		</div>

		
		<div class="logo-container">
			<img src="logo.svg" alt="ReCalc Logo" />
		</div>
    </div>
	
    <div class="container">
      <div id="app-content">
        <h1 id="app-title" class="centered-title"></h1>

        <!-- STEP 0: choose method -->
        <div id="step0">
          <h2 id="step0-title" class="centered-title" style="font-size:1.2rem;"></h2>
          <div class="method-choice-buttons">
            <button id="choose-scan-button" class="primary" onclick="chooseMethod('scan')"></button>
            <button id="choose-manual-button" class="secondary" onclick="chooseMethod('manual')"></button>
          </div>
        </div>

        <!-- SCAN STEP: camera capture + OCR extraction (scan flow only) -->
        <div id="scan-step" style="display: none; margin-top: 10px;">
          <h2 id="scan-step-title" class="centered-title" style="font-size:1.2rem;"></h2>

          <input type="file" accept="image/*" capture="environment" id="scan-file-camera" style="display:none;">
          <input type="file" accept="image/*" id="scan-file-upload" style="display:none;">

          <div id="scan-capture-buttons" style="display:flex; gap:10px; flex-wrap:wrap; justify-content:center;">
            <button type="button" id="scan-camera-button" class="primary" onclick="triggerCameraCapture()"></button>
            <button type="button" id="scan-upload-button" class="secondary" onclick="triggerUploadCapture()"></button>
          </div>

          <span id="scan-error-message" class="error-message"></span>

          <div id="scan-preview-wrapper" style="display:none; text-align:center; margin-top:14px;">
            <img id="scan-preview-img" alt="Receipt preview" style="max-width:100%; max-height:420px; border-radius:10px; box-shadow:0 4px 10px rgba(0,0,0,0.15);">
            <div style="display:flex; gap:10px; justify-content:center; flex-wrap:wrap; margin-top:10px;">
              <button type="button" id="scan-extract-button" class="primary" onclick="extractReceiptData()"></button>
              <button type="button" id="scan-retake-button" class="secondary" onclick="retakePhoto()"></button>
            </div>
            <div id="scan-loading" style="display:none; margin-top:10px; font-weight:600; color:#004794;"></div>
          </div>

          <div style="text-align:center; margin-top:10px;">
            <button type="button" id="scan-manual-fallback-button" class="secondary" onclick="scanManualFallback()" style="font-size:13px;"></button>
          </div>

          <div id="scan-fields-wrapper" style="display:none; margin-top:14px;">
            <label for="scan-total-order"><span id="scan-label-total-order" class="red-label"></span></label>
            <input type="number" id="scan-total-order" step="0.01" style="margin-bottom:10px;">
            <span id="scan-total-order-error" class="error-message"></span>

            <label for="scan-sub-total" style="margin-top:10px;"><span id="scan-label-sub-total" class="red-label"></span></label>
            <input type="number" id="scan-sub-total" step="0.01" style="margin-bottom:10px;" oninput="updateScanItemsSum()">
            <span id="scan-sub-total-error" class="error-message"></span>

            <label for="scan-discount" style="margin-top:10px;"><span id="scan-label-discount"></span></label>
            <input type="number" id="scan-discount" step="0.01" style="margin-bottom:10px;">
            <span id="scan-discount-error" class="error-message"></span>

            <h3 id="scan-items-title" style="margin-top:16px;"></h3>
            <div id="scan-items-container" class="scan-items-container"></div>
            <button type="button" id="scan-add-item-button" class="secondary" onclick="addScanItemRow()" style="margin-top:8px;"></button>

            <div id="scan-items-sum-row" style="margin-top:12px; font-weight:600;">
              <span id="scan-items-sum-label"></span>
            </div>
            <span id="scan-mismatch-error" class="error-message"></span>

            <div style="margin-top:16px;">
              <button type="button" id="scan-back-button" class="secondary" onclick="showSection('scan-step','step0')"></button>
              <button type="button" id="scan-continue-button" class="primary" onclick="scanContinue()"></button>
            </div>
          </div>
        </div>

        <!-- STEP 1: number of people & names (used by BOTH flows) -->
        <div id="step1" style="display: none;">
          <label for="num-people" style="margin-top: 10px;"><span id="label-num-people"></span></label>
          <input type="number" id="num-people" min="1" required style="margin-bottom: 10px;" />
          <span id="num-people-error" class="error-message"></span>
          <button id="generate-names-button" onclick="generateNames()"></button>
          <form id="names-form" class="names-container" style="margin-top: 10px;" autocomplete="off" onsubmit="return false;"></form>

		  <span id="person-names-error" class="error-message"></span>
          <div style="margin-top:10px;">
            <button id="back-to-step0-button" class="secondary" onclick="goBackToStep0()"></button>
            <button id="next-button" onclick="goToStep2FromStep1()" style="display: none;"></button>
          </div>
        </div>

        <!-- ASSIGN STEP: assign scanned items to people (scan flow only) -->
        <div id="assign-step" style="display: none; margin-top: 10px;">
          <h2 id="assign-step-title" class="centered-title" style="font-size:1.2rem;"></h2>
          <p id="assign-step-subtitle" style="text-align:center; color:#333; margin-top:-10px;"></p>

          <label for="assign-total-order"><span id="assign-label-total-order" class="red-label"></span></label>
          <input type="number" id="assign-total-order" step="0.01" style="margin-bottom: 10px;">
          <span id="assign-total-order-error" class="error-message"></span>

          <label for="assign-sub-total" style="margin-top:10px;"><span id="assign-label-sub-total" class="red-label"></span></label>
          <input type="number" id="assign-sub-total" step="0.01" style="margin-bottom: 10px;">
          <span id="assign-sub-total-error" class="error-message"></span>

          <label for="assign-discount" style="margin-top:10px;"><span id="assign-label-discount"></span></label>
          <input type="number" id="assign-discount" step="0.01" style="margin-bottom: 10px;">
          <span id="assign-discount-error" class="error-message"></span>

          <div id="assign-items-container" class="assign-items-container" style="margin-top:15px;"></div>
          <button type="button" id="assign-add-item-button" class="secondary" onclick="addAssignItemRow()" style="margin-top:8px;"></button>

          <span id="assign-unassigned-error" class="error-message"></span>
          <span id="assign-mismatch-error-message" class="error-message"></span>

          <div style="margin-top:16px;">
            <button type="button" id="assign-back-button" class="secondary" onclick="showSection('assign-step','step1')"></button>
            <button type="button" id="assign-calculate-button" class="primary" onclick="calculateFromAssignment()"></button>
          </div>
        </div>

        <div id="step2and3" style="display: none; margin-top: 20px;">
          <label for="total-order">
            <span id="label-total-order" class="red-label"></span>
          </label>
          <input type="number" id="total-order" step="0.01" required style="margin-bottom: 10px;" />
          <span id="total-order-error" class="error-message"></span>

          <label for="sub-total" style="margin-top: 10px;">
            <span id="label-sub-total" class="red-label"></span>
          </label>
          <input type="number" id="sub-total" step="0.01" required style="margin-bottom: 10px;" />
            <span id="sub-total-error" class="error-message"></span>

          <label for="discount" style="margin-top: 10px;">
            <span id="label-discount"></span>
          </label>
          <input type="number" id="discount" step="0.01" style="margin-bottom: 10px;" />
            <span id="discount-error" class="error-message"></span>

          <div id="cards-container" class="cards-container" style="margin-top: 15px;"></div>		      
          <span id="mismatch-error-message" class="error-message"></span>          
          <button onclick="goBackToStep1()" id="back-to-step1-button" style="margin-top: 10px;"></button>
          <button onclick="calculateVAT()" id="calculate-button" style="margin-top: 10px; margin-bottom: 20px;"></button>
        </div>

        <div id="result" style="display: none; margin-top: 20px;">
          <h2 id="results-title"></h2>
          <div id="result-cards-container" class="result-cards-container" style="margin-bottom: 10px;"></div>
          <button onclick="goToStep2()" id="back-to-step3-button"></button>
          <button onclick="startAgain()" id="start-again-button"></button>
          <button onclick="shareFullResult()" id="share-result-button"></button>

        </div>
      </div>
    </div>
  </div>
  
  <!-- HOW TO USE button (add this before the Buy-me-a-coffee block) -->
  <div style="text-align: center; margin-top: 18px;" id="howto-button-wrapper">
    <button id="howto-button" class="btn primary" onclick="window.location.href='tutorial.html'">
     How to use
    </button>
  </div>


	<div class="coffee-button-wrapper">
		<div id="coffee-text" class="coffee-message">
		</div>
		
		<div style="margin-top: 12px; text-align: center; direction: ltr;">
			<script
			type="text/javascript"
			src="https://cdnjs.buymeacoffee.com/1.0.0/button.prod.min.js"
			data-name="bmc-button"
			data-slug="ahmedyoussef"
			data-color="#004794"
			data-emoji="☕"
			data-font="Cookie"
			data-text="Buy me a coffee"
			data-outline-color="#000000"
			data-font-color="#FFFFFF"
			data-coffee-color="#FFDD00">
			</script>
		</div>
	</div>
 
<div id="auth-modal" class="auth-modal" style="display:none;">
  <div class="auth-modal-content card" role="dialog" aria-modal="true" aria-labelledby="auth-modal-title">
    <div style="display:flex; justify-content:space-between; align-items:center; gap:12px;">
      <h3 id="auth-modal-title" style="margin:0;">Sign in</h3>
      <button aria-label="Close" class="auth-close-btn" onclick="closeAuthModal()">✕</button>
    </div>

    <div id="auth-email-section" style="margin-top:12px;">
      <input id="auth-email" type="email" autocomplete="username" placeholder="Email">
      <input id="auth-password" type="password" autocomplete="current-password" placeholder="Password">
    </div>

    <div style="display:flex; gap:8px; justify-content:flex-end; margin-top:8px;">
      <button id="auth-action-button" class="primary">Sign in</button>
    </div>

    <div style="margin-top:14px; display:flex; align-items:center; gap:8px; justify-content:center;">
      <hr style="flex:1; border:none; height:1px; background:rgba(0,0,0,0.06);">
      <small style="color:#666;">or</small>
      <hr style="flex:1; border:none; height:1px; background:rgba(0,0,0,0.06);">
    </div>
	
	<div class="google-button-wrapper">
		<a href="#" class="google-sign-in-button" onclick="authSignInWithGoogleUI(); return false;">
		<div class="google-icon-wrapper">
			<svg version="1.1" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48">
				<path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"></path>
				<path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"></path>
				<path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"></path>
				<path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"></path>
				<path fill="none" d="M0 0h48v48H0z"></path>
			</svg>
		</div>
		<span class="button-text">Sign in with Google</span>
		</a>
	</div>

	
    <div style="margin-top:12px; text-align:center; font-size:13px; color:#444;">
      <span id="auth-switch-message">Don't have an account? <a href="#" onclick="switchAuthMode('signup'); return false;">Sign up</a></span>
    </div>
  </div>
</div>


 
  <footer>
	<div class="footer-row">
      <div class="footer-links">
        <a href="about.html" id="footer-link-about">About</a>
        <a href="privacy.html" id="footer-link-privacy">Privacy</a>
        <a href="contact.html" id="footer-link-contact">Contact</a>
        <a href="blog.html" id="footer-link-blog">Blog</a>
      </div>
    <span id="footer-text" class="footer-rights"></span>
  </div>

	<script src="main.js"></script>

  <script>
    function changeLanguage(lang) {
      localStorage.setItem('preferredLanguage', lang);
      window.setLanguage(lang);
      document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
      document.querySelector('#language-select select').value = lang;
    }
  </script>


</body>
</html>
