<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>History - reCalc</title>
  <link rel="stylesheet" href="styles.css" />

  <script>
    // Capture page load start time as early as possible
    window.startTime = Date.now();
  </script>
  <script src="https://unpkg.com/lottie-web@5.9.4/build/player/lottie.min.js" defer></script>

  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-functions-compat.js"></script>

  <style>
    /* Style for the 'Delete All' button */
    button.delete-btn-all {
      background-color: #b52424;
      /* Red */
      color: white;
      border: none;
      padding: 6px 12px;
      font-size: 14px;
      margin: 0;
      /* Margin is now handled by flex gap */
    }

    button.delete-btn-all:hover {
      background-color: #a03;
      /* Darker red */
    }

    /* Style to explicitly gray-out disabled pagination buttons */
    button:disabled,
    button[disabled] {
      background-color: #cccccc;
      color: #666666;
      cursor: not-allowed;
      opacity: 0.7;
      transform: none;
      box-shadow: none;
    }
  </style>
</head>

<body>
  <div id="page-loader" class="active">
    <div class="loader-lottie"></div>
  </div>

  <div id="page-wrapper">
    <div style="text-align: center; margin-top: 50px;">
      <a href="index.html">
        <img src="logo.svg" alt="ReCalc Logo" style="max-width: 320px; height: auto;" />
      </a>
    </div>

    <div style="max-width:1000px; margin: 18px auto 0; display:flex; justify-content:flex-end; padding:0 16px;">
      <span class="lang-link" onclick="toggleLanguage()" id="history-lang-toggle">🌐 English</span>
    </div>
    <main class="container" style="margin-top:18px;">
      <h2 id="manage-history-title" class="centered-title" style="font-size: 24px; font-weight: 800; margin-top: 0;">
        Full History</h2>

      <div style="display: flex; flex-direction: column; align-items: center; gap: 10px; margin-bottom: 24px;">

        <button id="back-to-manage-btn" onclick="window.location.href='manage.html'" class="secondary"
          style="margin: 0; padding: 6px 12px; font-size: 14px; width: fit-content;"></button>

        <button id="delete-all-btn" onclick="confirmDeleteAllHistory()" class="delete-btn-all"
          style="display: none; width: fit-content;"></button>

      </div>

      <div id="full-history-list">Loading history...</div>

      <div id="pagination-controls" style="text-align: center; margin-top: 24px; display: none;"></div>

    </main>
  </div>

  <script src="firebase.js"></script>
  <script src="translations.js"></script>
  <script src="main.js"></script>
  <script>
    const root = document.getElementById('full-history-list');
    const paginationControls = document.getElementById('pagination-controls');
    const deleteAllBtn = document.getElementById('delete-all-btn');

    let allHistoryItems = [];
    let currentPage = 1;
    const itemsPerPage = 15;

    function formatWhen(d) {
      if (!d) return '';
      if (typeof d.toDate === 'function') return d.toDate().toLocaleString();
      try { return new Date(d).toLocaleString(); } catch { return String(d); }
    }

    function renderPageItems(listArr) {
      const t = window.translations[window.currentLanguage] || window.translations['en'];
      if (!root) return;
      root.innerHTML = '';

      if (!listArr || listArr.length === 0) {
        if (allHistoryItems.length === 0) {
          root.innerHTML = '<p style="color:#666;">No history entries yet.</p>';
          if (deleteAllBtn) deleteAllBtn.style.display = 'none';
        }
        return;
      }

      if (deleteAllBtn) deleteAllBtn.style.display = 'inline-block';

      const items = Array.isArray(listArr) ? listArr : [];

      items.forEach((item) => {
        let when = '';
        if (item.createdAt && typeof item.createdAt.toDate === 'function') {
          when = item.createdAt.toDate().toLocaleString();
        } else if (item.createdAt) {
          try { when = new Date(item.createdAt).toLocaleString(); } catch { when = String(item.createdAt); }
        }

        const totalVal = Number(item.totalOrder ?? item.total ?? 0).toFixed(2);
        const subTotalVal = Number(item.subTotal ?? item.subtotal ?? 0).toFixed(2);

        const namesHtml = (item.totals || []).map(t => {
          const name = t.name || '';
          const value = Number(t.sum || 0).toFixed(2);
          let breakdownText = '';

          if (t.breakdown) breakdownText = String(t.breakdown);
          else if (t.items && Array.isArray(t.items)) {
            breakdownText = t.items
              .map(i => `${i.label || i.name || ''}: ${Number(i.price || i.value || 0).toFixed(2)}`)
              .join(', ');
          }

          return `<div class="history-name-line">
                    <strong>${name}:</strong>
                    <span class="history-value-blue">${value}</span>
                    ${breakdownText ? `<span class="history-breakdown"> (${breakdownText})</span>` : ''}
                  </div>`;
        }).join('');

        const idAttr = item.id ? item.id : '';
        const createdAtAttr = item.createdAt ? item.createdAt : '';

        const card = document.createElement('div');
        card.className = 'card history-card';
        card.innerHTML = `
          <div class="card-header">${when}</div>
          <div class="card-content" style="flex-direction:column; align-items:flex-start;">
            <div class="history-totals">
              <div class="history-total-line">
                <span>${t.totalToPay || t.totalOrder || 'Total'}:</span>
                <span class="history-value-red">${totalVal}</span>
              </div>
              <div class="history-subtotal-line">
                <span>${t.subTotal || 'Subtotal'}</span>
                <span class="history-value-red">${subTotalVal}</span>
              </div>
              ${(item.discount || item.discount === 0) ? `
                <div class="history-discount-line" style="display:flex; justify-content:space-between; font-weight:600; font-size:15px;">
                  <span>${(t.discount || 'Discount').replace(/\s*\(.*\)/, '')}</span>
                  <span class="history-value-red">${Number(item.discount || 0).toFixed(2)}</span>
                </div>
              ` : ''}
            </div>
            <div class="history-separator"></div>
            <div class="history-names">${namesHtml}</div>
          </div>
          <div class="card-actions">
            <button class="delete-btn" onclick="deleteAndReload('${idAttr}', '${createdAtAttr}')">${t.deleteButton || 'Delete'}</button>
          </div>
        `;
        root.appendChild(card);
      });
    }

    function renderPaginationControls() {
      if (!paginationControls) return;
      const totalPages = Math.ceil(allHistoryItems.length / itemsPerPage);

      if (totalPages <= 1) {
        paginationControls.innerHTML = '';
        paginationControls.style.display = 'none';
        return;
      }

      const t = window.translations[window.currentLanguage] || window.translations['en'];
      const prevText = t.backButton || 'Previous';
      const nextText = t.nextButton || 'Next';

      let html = `
            <button class="secondary" onclick="goToPage(${currentPage - 1})" ${currentPage === 1 ? 'disabled' : ''}>
                ${prevText}
            </button>
            <span style="margin: 0 15px; font-size: 14px; color: #333;">
                Page ${currentPage} of ${totalPages}
            </span>
            <button class="secondary" onclick="goToPage(${currentPage + 1})" ${currentPage === totalPages ? 'disabled' : ''}>
                ${nextText}
            </button>
        `;
      paginationControls.innerHTML = html;
      paginationControls.style.display = 'block';
    }

    function goToPage(page) {
      const totalPages = Math.ceil(allHistoryItems.length / itemsPerPage);
      if (page < 1 || page > totalPages) {
        return;
      }
      currentPage = page;
      renderCurrentPage();
      root.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }

    function renderCurrentPage() {
      const startIndex = (currentPage - 1) * itemsPerPage;
      const endIndex = startIndex + itemsPerPage;
      const pageItems = allHistoryItems.slice(startIndex, endIndex);
      renderPageItems(pageItems);
      renderPaginationControls();
    }

    async function loadAllHistoryForCurrentUser() {
      if (!root) return;
      root.innerHTML = 'Loading history...';
      paginationControls.style.display = 'none';
      if (deleteAllBtn) deleteAllBtn.style.display = 'none';

      try {
        const user =
          window.currentUser ||
          (window.firebase && window.firebase.auth && window.firebase.auth().currentUser) ||
          null;

        if (user && user.uid) {
          allHistoryItems = await getUserHistory(user.uid, 1000);
        } else {
          allHistoryItems = localGetHistory() || [];
        }

        currentPage = 1;
        renderCurrentPage();

      } catch (err) {
        console.error('History load error', err);
        root.innerHTML =
          '<div style="color:#c44;">Error loading history: ' +
          (err.message || err) +
          '</div>';
      }
    }

    async function deleteAndReload(docId, createdAt) {
      const t = window.translations[window.currentLanguage] || window.translations['en'];
      const confirmMsg = t.alertConfirmDeleteOne || 'Are you sure you want to delete this calculation?';

      if (!confirm(confirmMsg)) return;

      try {
        const user =
          window.currentUser ||
          (window.firebase && window.firebase.auth && window.firebase.auth().currentUser) ||
          null;

        if (user && user.uid && docId) {
          await window.deleteHistoryItem(user.uid, docId);
        } else if (!user && createdAt) {
          window.localDeleteHistory(createdAt);
        } else {
          alert('Cannot delete this item.');
          return;
        }
        await loadAllHistoryForCurrentUser();
      } catch (err) {
        alert('Could not delete: ' + (err.message || err));
      }
    }

    async function confirmDeleteAllHistory() {
      // MODIFIED: Use translation keys for confirm/alert messages
      const t = window.translations[window.currentLanguage] || window.translations['en'];
      const warnMsg = t.alertConfirmDeleteAll || 'Are you sure you want to delete ALL history? This action cannot be undone.';

      if (!confirm(warnMsg)) return;

      const user =
        window.currentUser ||
        (window.firebase && window.firebase.auth && window.firebase.auth().currentUser) ||
        null;

      try {
        if (user && user.uid) {
          if (allHistoryItems.length === 0) return;

          const deletePromises = allHistoryItems.map(item =>
            window.deleteHistoryItem(user.uid, item.id)
          );

          await Promise.all(deletePromises);
          alert(t.alertHistoryDeleted || 'All history has been deleted.');

        } else {
          localStorage.setItem('recalc_history', '[]');
          alert(t.alertLocalHistoryDeleted || 'All local history has been deleted.');
        }

        await loadAllHistoryForCurrentUser();

      } catch (err) {
        console.error("Delete all error:", err);
        alert('Could not delete all history: ' + (err.message || err));
      }
    }

    if (typeof window.onAuthStateChanged === 'function') {
      window.onAuthStateChanged((user) => {
        window.currentUser = user;
        loadAllHistoryForCurrentUser();
      });
    } else {
      setTimeout(loadAllHistoryForCurrentUser, 200);
    }

    if (!window.currentUser) {
      loadAllHistoryForCurrentUser();
    }
  </script>
</body>

</html>
